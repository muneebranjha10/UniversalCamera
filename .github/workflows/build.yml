name: Build Camera Enhancement APK
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon :app:assembleDebug
      - run: bash -n root/customize.sh
      - run: python3 pack.py dist/Samsung-Camera-Enhancement-v2.1-full.zip app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Samsung-Camera-Enhancement-v2.1
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            dist/Samsung-Camera-Enhancement-v2.1-full.zip
